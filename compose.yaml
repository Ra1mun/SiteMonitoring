services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/monitoring.db
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-deployment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-1000}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-10}
      HTTP_CHECK_TIMEOUT_MS: ${HTTP_CHECK_TIMEOUT_MS:-10000}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-5000}
    volumes:
      - monitoring-data:/data
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  monitoring-data:
